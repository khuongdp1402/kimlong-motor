    <script>
      // Apply the saved dark/light choice before first paint (no flash).
      // Mirrors src/context/ThemeModeProvider.jsx: dark by default, admin always light.
      (function () {
        var mode = 'dark';
        try { if (localStorage.getItem('theme') === 'light') mode = 'light'; } catch (e) {}
        var isAdmin = location.pathname.indexOf('/admin') === 0;
        if (mode === 'dark' && !isAdmin) document.documentElement.classList.add('dark');
      })();
    </script>
  </head>
  <body class="font-['Plus_Jakarta_Sans','Inter',sans-serif]">
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
